const books=[{title:'The Quiet Geometry',author:'Mara Lin',eyebrow:'Architecture / Essay',spine:'#bc3522',cover:`<svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="850" fill="#d43b22"/><path d="M0 572L600 145V850H0Z" fill="#f0dc55"/><circle cx="431" cy="286" r="126" fill="#183039"/><path d="M431 160v252M305 286h252" stroke="#f0dc55" stroke-width="3"/><text x="48" y="78" font-family="Arial" font-size="17" letter-spacing="5" fill="#fff">ATLAS EDITIONS</text><text x="45" y="690" font-family="Georgia" font-size="68" fill="#183039">THE QUIET</text><text x="45" y="752" font-family="Georgia" font-size="68" fill="#183039">GEOMETRY</text><text x="49" y="802" font-family="Arial" font-size="15" letter-spacing="4" fill="#183039">MARA LIN</text></svg>`,pages:[['Rooms that listen','A room is never empty. It holds temperature, footsteps, light, and the small negotiations of those who pass through it.','linear-gradient(135deg,#69757c,#d9c5a9 48%,#475156 49%,#222 100%)'],['The line and the pause','Architecture begins before the wall. It begins where movement slows, where a threshold asks the body to notice itself.','linear-gradient(25deg,#222 0 33%,#c9bfa9 34% 62%,#7d2e20 63%)'],['What silence builds','The quietest buildings are not mute. They make space for weather, memory and the small sounds that prove a room is alive.','radial-gradient(circle at 35% 35%,#f3e7cf 0 8%,transparent 9%),linear-gradient(145deg,#3b4a4b,#a9a28c)']]},{title:'After the Monsoon',author:'Ishan Vale',eyebrow:'Photography / Field Notes',spine:'#17332a',cover:`<svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="850" fill="#143229"/><g fill="none" stroke="#c9dc93" stroke-width="2" opacity=".78">${Array.from({length:22},(_,i)=>`<path d="M${-90+i*34} 850 Q${110+i*22} 430 ${35+i*31} 0"/>`).join('')}</g><rect x="54" y="54" width="492" height="742" fill="none" stroke="#f0eee7"/><text x="78" y="105" font-family="Arial" font-size="16" letter-spacing="5" fill="#f0eee7">FIELD RECORD 02</text><text x="78" y="630" font-family="Georgia" font-size="76" fill="#f0eee7">AFTER THE</text><text x="78" y="702" font-family="Georgia" font-size="76" fill="#f0eee7">MONSOON</text><text x="81" y="758" font-family="Arial" font-size="16" letter-spacing="4" fill="#c9dc93">ISHAN VALE</text></svg>`,pages:[['Water keeps a map','For forty mornings, I walked the same river road after the rain. The landscape changed faster than memory could organize it.','radial-gradient(circle at 64% 34%,#dce1c4 0 7%,transparent 8%),linear-gradient(150deg,#35473b,#84947e 45%,#26302b 46%,#b7b89f)'],['The returning green','Moss found every seam. Walls darkened by degrees, and the roadside ditches carried a different version of the sky.','linear-gradient(160deg,#132820 0 28%,#81927a 29% 58%,#d2c9ad 59%)'],['Field note 40','The rain did not erase the road. It revealed the road as a temporary agreement between water, soil and those who crossed it.','radial-gradient(circle at 70% 24%,#d9d7b7 0 7%,transparent 8%),linear-gradient(120deg,#4a5f51,#1e2b26)']]},{title:'Signal / Noise',author:'Nora Sato',eyebrow:'Culture / Technology',spine:'#1c1c1c',cover:`<svg viewBox="0 0 600 850" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="850" fill="#ece8dc"/><g>${Array.from({length:15},(_,i)=>`<rect x="${55+i*34}" y="170" width="17" height="${120+(i%5)*74}" fill="${i%3===0?'#ff4b2e':'#181818'}"/>`).join('')}</g><circle cx="472" cy="600" r="98" fill="#ff4b2e"/><text x="52" y="92" font-family="Arial" font-size="17" letter-spacing="6" fill="#181818">AN ATLAS INQUIRY</text><text x="48" y="690" font-family="Georgia" font-size="92" fill="#181818">SIGNAL</text><text x="48" y="775" font-family="Georgia" font-size="92" fill="#181818">/ NOISE</text><text x="430" y="606" font-family="Arial" font-size="14" letter-spacing="3" fill="#ece8dc">NORA SATO</text></svg>`,pages:[['The texture of attention','We designed machines to remove friction, then discovered that friction was how attention knew where to rest.','repeating-linear-gradient(90deg,#171717 0 6px,#e4dfd3 6px 10px,#fa5438 10px 14px)'],['A useful interruption','Not every interruption is noise. Some disturbances give shape to time and return the body to the room it occupies.','linear-gradient(135deg,#efebe0 0 36%,#171717 37% 67%,#ff4b2e 68%)'],['The right amount of static','A humane interface does not demand continuous focus. It gives attention edges, exits and somewhere quiet to land.','repeating-radial-gradient(circle at 50% 50%,#171717 0 4px,#ece8dc 5px 12px,#ff4b2e 13px 15px)']]}];
