name: Temporary encrypted Ahrefs verifier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Stage 1 — generate one-time RSA keypair
        if: ${{ hashFiles('tmp-ahrefs-token.enc') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out private.pem
          openssl pkey -in private.pem -pubout -out public.pem

      - name: Upload one-time public key
        if: ${{ hashFiles('tmp-ahrefs-token.enc') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ahrefs-ephemeral-public
          path: public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Upload one-time private key
        if: ${{ hashFiles('tmp-ahrefs-token.enc') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ahrefs-ephemeral-private
          path: private.pem
          retention-days: 1
          if-no-files-found: error

      - name: Stage 2 — download private key from keygen run
        if: ${{ hashFiles('tmp-ahrefs-token.enc') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(tr -d '[:space:]' < tmp-ahrefs-keygen-run.txt)
          test -n "$RUN_ID"
          mkdir -p keypair
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ahrefs-ephemeral-private --dir keypair
          test -s keypair/private.pem

      - name: Stage 2 — decrypt API key without logging it
        if: ${{ hashFiles('tmp-ahrefs-token.enc') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl pkeyutl -decrypt \
            -inkey keypair/private.pem \
            -in tmp-ahrefs-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/ahrefs-token.txt
          TOKEN=$(cat /tmp/ahrefs-token.txt)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf 'AHREFS_API_KEY=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          shred -u /tmp/ahrefs-token.txt || rm -f /tmp/ahrefs-token.txt

      - name: Stage 2 — check RDAP and Domain Rating by Ahrefs
        if: ${{ hashFiles('tmp-ahrefs-token.enc') != '' }}
        env:
          AHREFS_API_KEY: ${{ env.AHREFS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          GROUPS = {
              "name": ["bruch","big-data","delizaur","yycode","bsl","node","data","model","field","item","attr","param","arg","ctx","prop","file","user","class","table","schema","column","route","task","event","service","package","module","repo","project","object","record","type","method","function","element","component","resource","namespace","database","collection","document","form","input","button","option","query","property","config","plugin","theme","template","controller","action","command","worker","queue","channel","topic","stream","socket","session","cookie","header","response","request","result","value","key","label","title","status","error","message","token","account","profile","author","owner","client","server","api","app","page","site","link","path","url","host"],
              "host": ["request","url","location","origin","proxy","backend","socket","smtp","redis","database","db","server","client","target","source","remote","local","api","web","mail","ftp","ssh","pointer","savvy","current","upstream","downstream","gateway","primary","secondary","hostname","virtual","docker","cluster","node","service","app","application"],
              "style": ["element","node","button","input","table","cell","default","hover","active","focus","link","page","body","text","header","footer","container","component","theme","global","main","app","layout","current","custom","inline","computed","display","editor","widget","form","label","image","card","modal","menu","nav","section"],
              "email": ["user","contact","sender","recipient","account","customer","admin","support","billing","profile","member","owner","author","employee","client","reply","notification","service","primary","secondary","work","personal","login","recovery","verified","business","company","order","invoice"],
              "link": ["item","node","page","source","target","profile","user","external","internal","download","share","short","canonical","button","menu","footer","header","resource","current","next","previous","social","affiliate","reference","author","product","image","video","file","document","website","site"],
              "click": ["button","link","element","mouse","event","item","target","ad","menu","card","image","banner","track","user","single","double","right","left","outside","handler","action","submit","download","close","open"],
              "run": ["task","job","command","workflow","pipeline","model","script","test","build","deploy","server","client","app","agent","tool","batch","process","action","main","start","dev","prod","local","remote","setup","install","release","migration","worker","cron","scheduled","manual","preview"],
              "page": ["current","next","previous","home","error","login","profile","result","search","landing","product","checkout","settings","admin","index","detail","category","archive","contact","about","support","help","dashboard","account","user","order","cart","blog","post","article","author","tag","service","pricing","download"],
              "site": ["current","user","web","project","source","target","main","demo","test","preview","client","company","product","brand","portfolio","static","public","private","local","remote","production","development","staging","docs","support","help","official","personal","business","community","member","partner"],
              "date": ["created","updated","event","start","end","publish","release","due","birth","expiry","modified","order","invoice","current","today","tomorrow","yesterday","post","article","payment","delivery","shipping","signup","login","last","next","previous","effective","closing","opening","renewal"],
              "media": ["file","item","social","digital","source","user","profile","product","post","content","upload","image","video","audio","stream","library","gallery","asset","news","press","marketing","brand","campaign","editor","player","manager","server","storage","download","archive"],
              "video": ["file","source","player","background","hero","product","demo","preview","intro","tutorial","upload","stream","main","cover","profile","social","short","featured","training","course","lesson","recording","live","archive","sample","output","render","final","media"],
              "photo": ["profile","user","item","product","cover","author","team","event","gallery","upload","main","featured","social","header","background","passport","portrait","sample","original","edited","final","album","archive","camera","stock","media","image"],
              "network": ["node","service","config","local","private","public","social","user","server","client","docker","proxy","main","test","production","development","default","internal","external","wireless","home","office","business","cloud","data","mesh","virtual","security","monitor","status","admin"],
              "support": ["tech","customer","user","client","product","app","service","billing","developer","online","help","premium","technical","account","sales","email","phone","live","community","admin","partner","member","software","hardware","website","platform"],
              "help": ["user","context","app","product","developer","admin","customer","online","quick","support","tech","account","billing","setup","install","guide","docs","service","website","platform","community","member","sales","contact","emergency","self"],
              "review": ["code","pull","product","user","peer","security","design","content","annual","performance","customer","book","movie","app","software","website","service","course","article","editorial","technical","quality","internal","external","final","expert","team"],
              "report": ["audit","status","error","sales","traffic","security","monthly","annual","test","incident","analytics","performance","daily","weekly","quarterly","financial","user","admin","system","health","quality","bug","issue","usage","revenue","marketing","seo","search","ranking","backlink","domain"],
              "guide": ["style","user","developer","setup","install","admin","brand","design","quick","api","start","beginner","advanced","product","service","website","application","deployment","migration","security","content","seo","marketing","writing","editorial","technical","reference","complete","official"],
              "wiki": ["project","repo","team","developer","product","community","internal","user","company","game","software","app","service","platform","knowledge","support","help","docs","documentation","public","private","personal","business","technical","data","research","open","local"],
              "download": ["file","asset","report","media","image","video","data","export","backup","source","package","installer","setup","app","application","software","update","release","archive","document","pdf","audio","music","book","template","plugin","theme","tool","client","server","driver","firmware"],
              "properties": ["german","english","application","local","gradle","server","database","jdbc","system","messages","config","logging","mail","hibernate","project","build","user","test","dev","prod","env","default","global","security","spring","maven","sonar","release","app","client","service","api","web","cloud","docker","kafka","redis","mysql","postgres","elasticsearch","search","payment","auth","oauth","email","notification","version","deploy","production","development","staging","qa"],
              "zip": ["clientupdate","storageapi","source","sources","release","update","backup","archive","package","download","installer","setup","assets","images","data","database","logs","export","import","project","website","theme","plugin","sdk","api","docs","samples","config","media","resources","build","dist","public","static","frontend","backend","server","client","app","application","version","patch","hotfix","software","firmware","driver","template","files","documents","photos","videos","audio","content","code","repository","repo","wordpress","migration","complete","final","latest","full","bundle","library","dataset"],
              "mov": ["sample","video","output","render","preview","clip","intro","trailer","final","demo","export","master","source","project","main","movie","recording","screen","animation","motion","background","hero","product","social","short","camera","original","edited","media","footage","promo","teaser"],
          }

          DOMAINS = sorted({f"{label}.{tld}" for tld, labels in GROUPS.items() for label in labels})
          TOKEN = os.environ.get("AHREFS_API_KEY", "").strip()
          if not TOKEN:
              raise SystemExit("Missing Ahrefs API key")

          def request(url: str, *, headers: dict[str, str] | None = None, timeout: int = 25):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "WhoopsSEO-Ahrefs-Verifier/1.0"})
              return urllib.request.urlopen(req, timeout=timeout)

          def rdap(domain: str) -> dict:
              url = "https://rdap.org/domain/" + urllib.parse.quote(domain)
              for attempt in range(4):
                  try:
                      with request(url) as response:
                          return {"domain": domain, "status": "registered", "http": response.status}
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return {"domain": domain, "status": "likely_available", "http": 404}
                      if exc.code in (429, 500, 502, 503, 504) and attempt < 3:
                          time.sleep(0.5 * (2 ** attempt))
                          continue
                      return {"domain": domain, "status": "unknown", "http": exc.code, "error": str(exc)}
                  except Exception as exc:
                      if attempt < 3:
                          time.sleep(0.5 * (2 ** attempt))
                          continue
                      return {"domain": domain, "status": "unknown", "http": 0, "error": str(exc)}
              return {"domain": domain, "status": "unknown", "http": 0}

          def ahrefs(domain: str) -> dict:
              query = urllib.parse.urlencode({"target": domain, "output": "json"})
              url = "https://api.ahrefs.com/v3/public/domain-rating-free?" + query
              headers = {
                  "Accept": "application/json",
                  "Authorization": "Bearer " + TOKEN,
                  "User-Agent": "WhoopsSEO-Ahrefs-Verifier/1.0",
              }
              for attempt in range(5):
                  try:
                      with request(url, headers=headers) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      block = payload.get("domain_rating") or {}
                      raw = block.get("domain_rating")
                      value = float(raw) if raw is not None else None
                      return {
                          "domain": domain,
                          "ok": value is not None,
                          "dr": value,
                          "http": 200,
                          "license": block.get("license", ""),
                      }
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")[:300]
                      if exc.code == 429 and attempt < 4:
                          retry_after = exc.headers.get("Retry-After")
                          try:
                              delay = max(float(retry_after), 1.0) if retry_after else 1.0 * (2 ** attempt)
                          except ValueError:
                              delay = 1.0 * (2 ** attempt)
                          time.sleep(delay)
                          continue
                      return {"domain": domain, "ok": False, "dr": None, "http": exc.code, "error": body}
                  except Exception as exc:
                      if attempt < 4:
                          time.sleep(0.75 * (2 ** attempt))
                          continue
                      return {"domain": domain, "ok": False, "dr": None, "http": 0, "error": str(exc)}
              return {"domain": domain, "ok": False, "dr": None, "http": 0}

          probe = ahrefs("example.com")
          if not probe.get("ok"):
              raise SystemExit("Ahrefs API validation failed: " + json.dumps(probe, ensure_ascii=False))

          rdap_results: list[dict] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for result in pool.map(rdap, DOMAINS):
                  rdap_results.append(result)

          likely = [r["domain"] for r in rdap_results if r.get("status") == "likely_available"]
          ahrefs_results: list[dict] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(ahrefs, domain): domain for domain in likely}
              for future in concurrent.futures.as_completed(futures):
                  ahrefs_results.append(future.result())
                  time.sleep(0.05)

          rdap_map = {r["domain"]: r for r in rdap_results}
          rows = []
          for result in ahrefs_results:
              if not result.get("ok"):
                  continue
              dr = float(result["dr"])
              if dr >= 10:
                  verdict = "priority_check"
              elif dr >= 5:
                  verdict = "manual_review"
              elif dr > 0:
                  verdict = "low_priority"
              else:
                  verdict = "skip"
              rows.append({
                  "domain": result["domain"],
                  "dr": dr,
                  "rdap": rdap_map[result["domain"]]["status"],
                  "verdict": verdict,
                  "license": result.get("license", ""),
              })

          rows.sort(key=lambda row: (-row["dr"], row["domain"]))
          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "attribution": "Domain Rating by Ahrefs",
              "candidate_count": len(DOMAINS),
              "rdap_likely_available_count": len(likely),
              "rdap_registered_count": sum(1 for r in rdap_results if r.get("status") == "registered"),
              "rdap_unknown": [r for r in rdap_results if r.get("status") == "unknown"],
              "ahrefs_success_count": sum(1 for r in ahrefs_results if r.get("ok")),
              "ahrefs_errors": [r for r in ahrefs_results if not r.get("ok")],
              "results": rows,
          }
          with open("ahrefs-results.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          print(json.dumps({
              "candidate_count": payload["candidate_count"],
              "rdap_likely_available_count": payload["rdap_likely_available_count"],
              "ahrefs_success_count": payload["ahrefs_success_count"],
              "dr_ge_5": sum(1 for r in rows if r["dr"] >= 5),
              "top": [{"domain": r["domain"], "dr": r["dr"]} for r in rows[:20]],
          }, ensure_ascii=False))
          PY

      - name: Upload Ahrefs results
        if: ${{ hashFiles('ahrefs-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ahrefs-domain-results
          path: ahrefs-results.json
          retention-days: 1
          if-no-files-found: error
