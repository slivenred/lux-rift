name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/demos/diffraction-card-v6
          cp index.html styles.css shaders.js app.js .nojekyll _site/
          cp assets/preview.svg _site/assets/preview.svg

          cat \
            demos/diffraction-card-v6.zip.b64.00 \
            demos/diffraction-card-v6.zip.b64.01 \
            demos/diffraction-card-v6.zip.b64.02 \
            demos/diffraction-card-v6.zip.b64.03 \
            demos/diffraction-card-v6.zip.b64.04 \
            demos/diffraction-card-v6.zip.b64.05a \
            demos/diffraction-card-v6.zip.b64.05b \
            demos/diffraction-card-v6.zip.b64.06 \
            demos/diffraction-card-v6.zip.b64.07 \
            demos/diffraction-card-v6.zip.b64.08 \
            demos/diffraction-card-v6.zip.b64.09 \
            | tr -d '\n\r ' \
            | base64 -d > /tmp/diffraction-card-v6.zip

          unzip -q /tmp/diffraction-card-v6.zip \
            -d _site/demos/diffraction-card-v6

          test -f _site/demos/diffraction-card-v6/index.html
          test -f _site/demos/diffraction-card-v6/src/main.js
          test -f _site/demos/diffraction-card-v6/assets/card.webp

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
